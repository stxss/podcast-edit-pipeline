<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TQ Review</title>
<style>
  :root { --bg:#16171a; --panel:#1f2125; --line:#2d3036; --text:#e4e6ea; --dim:#8b9099; --cut:#e5484d; --keep:#30a46c;
          --mute:#f5a524; --accent:#7c8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px;
           display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  h1 { font-size:16px; margin:0 12px 0 0; }
  .tabs button, .seg button, .btn { background:#2a2d33; color:var(--text); border:1px solid var(--line); padding:5px 10px;
           border-radius:6px; cursor:pointer; font:inherit; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .spacer { flex:1; }
  #status { color:var(--dim); font-size:12px; }
  main { max-width:1100px; margin:0 auto; padding:12px 16px 80px; }
  .filters { display:flex; flex-wrap:wrap; gap:14px; margin:6px 0 12px; color:var(--dim); font-size:13px; }
  .filters label { display:flex; gap:5px; align-items:center; cursor:pointer; }
  .summary { color:var(--dim); font-size:13px; margin-bottom:8px; }
  .row { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:8px;
         padding:9px 12px; margin-bottom:8px; display:grid; grid-template-columns:110px minmax(0,1fr) auto; gap:12px; align-items:start; }
  .row > div { min-width:0; }
  .ctx { overflow-wrap:anywhere; }
  .row.sel { outline:2px solid var(--accent); }
  .row.d-cut { border-left-color:var(--cut); } .row.d-keep { border-left-color:var(--keep); } .row.d-mute { border-left-color:var(--mute); }
  .row.changed { box-shadow: inset 0 0 0 1px var(--accent); }
  .meta { font-size:12px; color:var(--dim); }
  .meta .t { font-size:15px; color:var(--text); font-variant-numeric:tabular-nums; font-weight:600; }
  .badge { display:inline-block; padding:0 6px; border-radius:4px; font-size:11px; margin:2px 4px 0 0; background:#30333a; }
  .r-high { background:#5b2a2c; } .r-medium { background:#5a4a1f; } .r-low { background:#30333a; } .r-tight { background:#5a3a1f; }
  .ctx { font-size:13px; color:var(--dim); }
  .ctx .w.L, .ctx .w.T { opacity:.75; }
  .v-pass { background:#1f4d36; } .v-fail { background:#7a2226; } .v-unclear, .v-unchecked { background:#4a4a20; }
  .vfail { color:#ff9a9e; font-size:12px; margin-bottom:3px; }
  .what { font-size:14px; margin-bottom:3px; } .what b { color:#ffb3b5; font-weight:600; }
  .d-keep .what b { color:#bfe8d1; } .d-mute .what b { color:#ffe1a6; }
  .w { margin-right:4px; }
  .w.in { background:rgba(229,72,77,.25); color:#ffb3b5; text-decoration:line-through; border-radius:3px; padding:0 2px; }
  .d-keep .w.in { text-decoration:none; background:rgba(48,164,108,.2); color:#bfe8d1; }
  .d-mute .w.in { text-decoration:none; background:rgba(245,165,36,.22); color:#ffe1a6; }
  .note { color:var(--dim); font-size:12px; margin-top:3px; }
  .ctrl { display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .seg { display:flex; } .seg button { border-radius:0; } .seg button:first-child { border-radius:6px 0 0 6px; }
  .seg button:last-child { border-radius:0 6px 6px 0; }
  .seg button.on.cut { background:var(--cut); border-color:var(--cut); } .seg button.on.keep { background:var(--keep); border-color:var(--keep); }
  .seg button.on.mute { background:var(--mute); border-color:var(--mute); color:#111; }
  .play { display:flex; gap:4px; }
  table { width:100%; border-collapse:collapse; } td, th { padding:6px; border-bottom:1px solid var(--line); text-align:left; }
  input[type=text], input[type=number] { background:#111316; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:4px 6px; font:inherit; width:100%; }
  input.num { width:90px; }
  .help { color:var(--dim); font-size:12px; }
  kbd { background:#2a2d33; border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size:11px; }
  .editor { grid-column:1 / -1; border-top:1px solid var(--line); padding-top:8px; }
  .ebar .grp { display:inline-flex; gap:2px; align-items:center; background:#24262b; border-radius:7px; padding:2px 4px; }
  .btn.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .ebar .hover { margin-left:auto; font-variant-numeric:tabular-nums; }
  .editor .help { margin-top:4px; }
  .editor canvas { width:100%; height:230px; display:block; background:#111316; border-radius:6px; cursor:crosshair; touch-action:none; }
  .ebar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:6px; font-size:12px; color:var(--dim); }
  .ebar .edge { font-variant-numeric:tabular-nums; color:var(--text); }
  .chk { margin-top:4px; font-size:13px; } .chk .bad { color:#ff9a9e; } .chk .ok { color:#8fd6ad; }
  .v-edited { background:#2d3b6e; }
  .subs { margin-top:6px; display:flex; flex-direction:column; gap:4px; }
  .sub { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px; padding:3px 6px; border-left:3px solid var(--line); background:#1a1c20; border-radius:4px; }
  .sub.d-cut { border-left-color:var(--cut); } .sub.d-keep { border-left-color:var(--keep); } .sub.d-mute { border-left-color:var(--mute); }
  .sub .st { color:var(--dim); font-variant-numeric:tabular-nums; } .sub .vfail { flex-basis:100%; margin:0; }
  .sub .seg button { padding:2px 8px; font-size:12px; }
  .w.in.kept { text-decoration:none; background:rgba(48,164,108,.2); color:#bfe8d1; }
  .ebar select { background:#111316; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:3px; font:inherit; }
  @media (max-width:700px) { .row { grid-template-columns:1fr; } .ctrl { align-items:flex-start; flex-direction:row; flex-wrap:wrap; } }
</style>
</head>
<body>
<header>
  <h1 id="title">TQ review</h1>
  <div class="tabs" id="tabs">
    <button data-tab="cuts" class="on">Cuts</button><button data-tab="cold">Cold open</button>
    <button data-tab="chapters">Chapters</button><button data-tab="shorts">Shorts</button>
  </div>
  <span class="spacer"></span>
  <span id="status">loading...</span>
  <button class="btn primary" id="save">Save</button>
</header>
<main>
  <section id="cuts">
    <div class="filters">
      <label><input type="checkbox" data-f="edl" checked> Cuts in the edit</label>
      <label><input type="checkbox" data-f="det" checked> Detector candidates</label>
      <label><input type="checkbox" data-f="mute" checked> Audio mutes</label>
      <label><input type="checkbox" data-f="user" checked> Your cuts</label>
      <label>| risk <select id="risk"><option value="">all</option><option>high</option><option>medium</option><option>low</option><option>tight</option></select></label>
      <label><input type="checkbox" id="changedOnly"> changed only</label>
      <label><input type="checkbox" id="lookOnly" checked> <b>only what needs a look</b></label>
      <label><input type="checkbox" id="failedOnly"> failed check only</label>
      <label><input type="checkbox" id="editedOnly"> edited only</label>
    </div>
    <div class="summary" id="summary"></div>
    <div class="help"><kbd>J</kbd>/<kbd>K</kbd> next/prev &nbsp; <kbd>Space</kbd> play edited &nbsp; <kbd>O</kbd> play original &nbsp; <kbd>X</kbd> toggle &nbsp; <kbd>E</kbd> edit edges &nbsp; <kbd>Ctrl+S</kbd> save<br>
      Editor open: <kbd>Space</kbd> play the join · <kbd>L</kbd> loop it · <kbd>←</kbd>/<kbd>→</kbd> end ±1 frame · <kbd>Shift</kbd>+<kbd>←</kbd>/<kbd>→</kbd> start ±1 frame · <kbd>+</kbd>/<kbd>-</kbd> zoom · <kbd>Tab</kbd> next cut in the row · <kbd>C</kbd>/<kbd>M</kbd> draw another cut/mute · <kbd>Del</kbd> delete one of yours</div>
    <div id="list"></div>
  </section>
  <section id="cold" hidden></section>
  <section id="chapters" hidden></section>
  <section id="shorts" hidden></section>
</main>
<audio id="player"></audio>
<script>
const $ = (s, el = document) => el.querySelector(s);
let D = null, sel = 0, dirty = false;
// speakers come from the show profile (/data): ids, names, colours
const SPK = () => D.speakers.map(s => s.id);
const COL = id => (D.speakers.find(s => s.id === id) || { color: "#999999" }).color;
const RGB = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(",");
const player = $("#player");
const fmt = (t) => { t = Math.max(0, t); const m = Math.floor(t / 60), s = (t - m * 60).toFixed(1); return `${m}:${s.padStart(4, "0")}`; };
const parseT = (v) => { v = String(v).trim(); if (v.includes(":")) { const [m, s] = v.split(":"); return (+m) * 60 + (+s); } return +v; };
const PAD = 2.5;

function setDirty(d) { dirty = d; $("#status").textContent = d ? "unsaved changes" : (D.saved_at ? `saved ${D.saved_at}` : "nothing saved yet"); }
function play(url) { if (typeof PL !== "undefined") { PL.loop = null; PL.loopId = null; PL.stop(); } player.src = url; player.play(); }
const edges = (it) => [it.a2 ?? it.a, it.b2 ?? it.b];
const isEdited = (it) => it.a2 != null;
const isCut = (it) => it.decision === "cut";
const isMute = (it) => it.decision === "mute";
const FADES = [[2, "2f (default)"], [4, "4f"], [6, "6f"], [10, "10f"], [0, "none"]];
const fadeOf = (it) => it.fade ?? 2;
// preview URL params for a group: every active cut / mute in it
function grpParams(grp) {
  const cuts = grp.filter(isCut).map(it => edges(it).join(",")).join(";");
  const mutes = grp.filter(isMute).map(it => edges(it).concat(it.spk).join(",")).join(";");
  return (cuts ? `&cut=${cuts}` : "") + (mutes ? `&mute=${mutes}` : "");
}
const span = (grp) => [Math.min(...grp.map(it => edges(it)[0])), Math.max(...grp.map(it => edges(it)[1]))];
function playGroup(grp, edited) {
  const [a, b] = span(grp);
  play(`/audio?a=${a - PAD}&b=${b + PAD}` + (edited ? grpParams(grp) : ""));
}
const isMuteKind = (it) => it.group === "mute" || (it.group === "user" && it.kind === "mute");
function options(it) { return isMuteKind(it) ? ["mute", "keep"] : ["cut", "keep"]; }

function visible() {
  const groups = [...document.querySelectorAll(".filters input[data-f]")].filter(x => x.checked).map(x => x.dataset.f);
  const risk = $("#risk").value, ch = $("#changedOnly").checked;
  const fo = $("#failedOnly").checked, lo = $("#lookOnly").checked;
  const eo = $("#editedOnly").checked;
  return D.items.filter(it => groups.includes(it.group) && (!risk || it.risk === risk) && (!ch || it.decision !== it.default || isEdited(it))
    && (!fo || it.verify === "fail" || (it.render && it.render.status === "flag") || (it.check && it.check.warn.length)) && (!eo || isEdited(it) || it.group === "user")
    && (!lo || it.look || it.group === "user" || isEdited(it) || it.decision !== it.default));
}
// neighbouring cuts (less than 0.35 s apart) are one row and one editor; a section you add inside an editor
// (anchor = that row's id) stays in that row however far from the others it is
const NEAR = 0.35;
function groupsOf(items) {
  const out = [], loose = [], anchored = [];
  for (const it of items) (it.group === "user" && it.anchor && items.some(x => x.id === it.anchor) ? anchored : loose).push(it);
  for (const it of loose.sort((x, y) => edges(x)[0] - edges(y)[0])) {
    const g = out[out.length - 1];
    if (g && edges(it)[0] <= Math.max(...g.map(x => edges(x)[1])) + NEAR) g.push(it); else out.push([it]);
  }
  for (const it of anchored) { const g = out.find(g => g.some(x => x.id === it.anchor)); g.push(it); }
  for (const g of out) g.sort((x, y) => edges(x)[0] - edges(y)[0]);
  return out;
}
let GROUPS = [];
const gid = (grp) => (grp.find(x => x.group !== "user" || !x.anchor) || grp[0]).id;
const GROUP = { edl: "in the edit", det: "candidate", mute: "audio mute", user: "yours" };
function updateSummary() {
  const n = (g, d) => D.items.filter(i => i.group === g && i.decision === d).length;
  $("#summary").textContent = `${GROUPS.length} rows (${visible().length} cuts) shown. In the edit: ${n("edl","cut")} cut, ${n("edl","keep")} undone. ` +
    `Candidates: ${n("det","cut")} to cut of ${D.items.filter(i=>i.group==="det").length}. Mutes: ${n("mute","mute")} of ${D.items.filter(i=>i.group==="mute").length}. ` +
    `Edited edges: ${D.items.filter(isEdited).length}. Your cuts: ${n("user","cut")}.`;
}
function renderCuts() {
  GROUPS = groupsOf(visible()); sel = Math.min(sel, Math.max(0, GROUPS.length - 1));
  updateSummary();
  const list = $("#list"); list.innerHTML = "";
  for (const k in rowEls) delete rowEls[k];
  GROUPS.forEach((grp, k) => {
    const row = document.createElement("div"); row._k = k; row._grp = grp;
    grp.forEach(it => rowEls[it.id] = row);
    fillRow(row);
    if (openId === gid(grp)) mountEditor(grp, row);
    list.appendChild(row);
  });
}
const esc = s => String(s).replace(/</g, "&lt;");
function whatOf(it) {
  const gone = it.ctx.filter(w => w.in).map(w => w.w);
  const verb = isMuteKind(it) ? `mutes ${it.spk}:` : "removes";
  return gone.length && !(gone.length === 1 && gone[0] === "(sound)") ? `${verb} "<b>${esc(gone.join(" "))}</b>"` : `${verb}: sound, no words`;
}
function renderOf(it) {
  const r = it.render; if (!r) return "";
  if (r.status === "pass") return `<span class="badge v-pass" title="the edited program, re-transcribed as a whole, reads right at this join">program check passed</span>`;
  const bits = [r.missing.length ? `missing "${esc(r.missing.join(" "))}"` : "", r.extra.length ? `extra "${esc(r.extra.join(" "))}"` : "", r.filler.length ? `filler left "${esc(r.filler.join(" "))}"` : ""].filter(Boolean);
  return `<span class="badge v-fail" title="${bits.join(", ")}">program check: ${bits.join(", ")}</span>`;
}
function badgeOf(it) {
  const live = isEdited(it) || it.group === "user";
  return live ? `<span class="badge v-edited">${it.group === "user" ? "yours" : "edited"}${it.check && it.check.warn.length ? " · warning" : ""}</span>`
    : `<span class="badge v-${it.verify}" title="${esc(it.verify_reason)}">${it.verify === "pass" ? "check passed" : it.verify === "fail" ? "check FAILED" : it.verify}</span>`;
}
function failOf(it) {
  const live = isEdited(it) || it.group === "user";
  if (live) return it.check && it.check.warn.length ? `<div class="vfail">${esc(it.check.warn.join(" · "))}</div>` : "";
  if (it.verify !== "fail") return "";
  const w = it.verify_words.filter(r => r[1] >= 0.15 && r[2] < 0.6 * r[1]).map(r => esc(r[0]) + " " + Math.round(r[1]*100) + "% → " + Math.round(r[2]*100) + "%").join(", ");
  return `<div class="vfail">${esc(it.verify_reason)}${w ? ` (audio match before → after the cut: ${w})` : ""}</div>`;
}
function ctxOf(grp) {   // context words of the whole group; a word is struck if any active cut in the group removes it
  const m = new Map();
  for (const it of grp) for (const w of it.ctx) {
    const key = w.t + "|" + w.w, on = w.in && it.decision !== "keep", o = m.get(key);
    if (!o) m.set(key, { ...w, in: w.in, on }); else { o.in = o.in || w.in; o.on = o.on || on; }
  }
  const ws = [...m.values()].sort((a, b) => a.t - b.t);
  return ws.map(w => `<span class="w${w.in ? " in" : ""}${w.in && !w.on ? " kept" : ""}" style="color:${w.spk ? COL(w.spk) : "inherit"}" title="${w.spk} ${w.t}">${esc(w.w)}</span>`).join("");
}
function segBtns(it) { return `<div class="seg" data-id="${esc(it.id)}">${options(it).map(o => `<button data-o="${o}" class="${o}${it.decision === o ? " on" : ""}">${o}</button>`).join("")}${it.group === "user" ? `<button data-o="del" title="delete this section (Del in the editor)">✕</button>` : ""}</div>`; }
function delUser(it) { const i = D.items.indexOf(it); if (i >= 0) D.items.splice(i, 1); setDirty(true); renderCuts(); }
function fillRow(row) {
  const k = row._k, grp = row._grp, ed = row.querySelector(".editor"), one = grp.length === 1, it = grp[0];
  const dec = grp.some(isCut) ? "cut" : grp.some(isMute) ? "mute" : "keep";
  row.className = `row d-${dec}` + (k === sel ? " sel" : "") + (grp.some(x => x.decision !== x.default || isEdited(x)) ? " changed" : "");
  const [a, b] = span(grp);
  const subs = one ? "" : `<div class="subs">${grp.map(x => `<div class="sub d-${x.decision}">${segBtns(x)}<span class="st">${fmt(edges(x)[0])}</span>
      <span>${whatOf(x)}</span><span class="badge">${GROUP[x.group]}</span><span class="badge">${x.kind}</span>${badgeOf(x)}${renderOf(x)}${x.fade != null ? `<span class="badge">fade ${x.fade || "none"}</span>` : ""}${failOf(x)}</div>`).join("")}</div>`;
  row.innerHTML = `
    <div class="meta"><div class="t">${fmt(a)}</div>${(b - a).toFixed(2)} s · ${[...new Set(grp.map(x => x.spk))].join("+")}<br>
      ${one ? `<span class="badge">${GROUP[it.group]}</span><span class="badge">${it.kind}</span><span class="badge r-${it.risk}">${it.risk}</span><br>${badgeOf(it)}${renderOf(it)}${it.fade != null ? `<span class="badge">fade ${it.fade || "none"}</span>` : ""}`
            : `<span class="badge">${grp.length} cuts together</span>`}</div>
    <div>${one ? `<div class="what">${whatOf(it)}</div>${failOf(it)}` : ""}<div class="ctx">…${ctxOf(grp)}…</div>${subs}
      ${grp.filter(x => x.note && x.group === "edl").map(x => `<div class="note">${esc(x.note)}</div>`).join("")}</div>
    <div class="ctrl">${one ? segBtns(it) : ""}
      <div class="play"><button class="btn" data-p="orig" title="O">▶ original</button><button class="btn" data-p="edit" title="Space">▶ edited</button><button class="btn" data-p="ed" title="E">${openId === gid(grp) ? "close" : "edit"}</button></div></div>`;
  row.querySelectorAll(".seg").forEach(sg => {
    const x = grp.find(y => y.id === sg.dataset.id);
    sg.querySelectorAll("button").forEach(bt => bt.onclick = () => { if (bt.dataset.o === "del") return delUser(x); x.decision = bt.dataset.o; sel = k; setDirty(true); fillRow(row); markSel(); updateSummary(); });
  });
  row.querySelector('[data-p="orig"]').onclick = () => { sel = k; playGroup(grp, false); markSel(); };
  row.querySelector('[data-p="edit"]').onclick = () => { sel = k; playGroup(grp, true); markSel(); };
  row.querySelector('[data-p="ed"]').onclick = () => { sel = k; toggleEditor(grp); };
  if (ed) { row.appendChild(ed); if (ed._refresh) ed._refresh(); }
}
function markSel() { [...document.querySelectorAll("#list .row")].forEach((r, k) => r.classList.toggle("sel", k === sel)); }

// ---------- edge editor ----------
// Waveform (1 ms peaks, both mics, 48 kHz audio) for the row's cuts +-4 s; zoom/pan inside it.
// Playback runs in the browser (Web Audio), so edits are heard instantly; the join can loop while you move edges.
// Each join is previewed with the cut's fade: a Constant Power crossfade of N frames centred on the edit, like Premiere.
let openId = null, edKey = null; const waveCache = {}, rowEls = {}, editorView = {}, editorAct = {};
const FR = 30, snap = t => Math.round(t * FR) / FR, LOAD = 4.0, JOIN = 0.7;
const fmtMs = (t) => { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(3).padStart(6, "0")}`; };
let AC = null;
const PL = { nodes: [], map: null, end: 0, loop: null, loopId: null, owner: null, tm: null,
  stop() { this.nodes.forEach(n => { try { n.stop(); } catch (e) {} }); this.nodes = []; this.map = null; clearTimeout(this.tm); },
  head() { if (!this.map || !AC) return null; const now = AC.currentTime; let h = null;
    for (const [t, s0, d] of this.map) if (now >= t && now < t + d) h = s0 + (now - t);
    return h; } };
function toggleEditor(grp) {
  PL.stop(); PL.loop = null; PL.loopId = null;
  openId = openId === gid(grp) ? null : gid(grp); renderCuts();
  const r = $("#list .row.sel"); if (r) r.scrollIntoView({ block: "nearest" });
}
async function getWave(grp) {
  const key = gid(grp), [ca, cb] = span(grp), w = waveCache[key];
  if (w && w.a <= ca - 1 && w.b >= cb + 1) return w;
  const a = Math.max(0, Math.min(ca, ...grp.map(x => x.a)) - LOAD), b = Math.max(cb, ...grp.map(x => x.b)) + LOAD;
  const W = await fetch(`/wave?a=${a}&b=${b}`).then(r => r.json());
  AC = AC || new AudioContext();
  const get = async spk => AC.decodeAudioData(await fetch(`/audio?a=${a}&b=${b}&solo=${spk}`).then(r => r.arrayBuffer()));
  W.buf = {}; for (const s of SPK()) W.buf[s] = await get(s);
  return waveCache[key] = W;
}
async function recheck(it) {

  edKey = (e) => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { nudge(e.shiftKey ? "a" : "b", e.key === "ArrowRight" ? 1 : -1); return true; }
    if (e.key === " ") { playJoin(); return true; }
    if (e.key === "l") { toggleLoop(); return true; }
    if (e.key === "Tab" && grp.length > 1) { act = (act + (e.shiftKey ? grp.length - 1 : 1)) % grp.length; showChk(); req(); return true; }
    if (e.key === "c") { setArm("cut"); return true; }
    if (e.key === "m") { setArm("mute"); return true; }
    if ((e.key === "Delete" || e.key === "Backspace") && A().group === "user") { delUser(A()); return true; }
    if (e.key === "Escape" && arm) { setArm(null); return true; }
    if (e.key === "+" || e.key === "=") { zoom(0.6); return true; }
    if (e.key === "-") { zoom(1 / 0.6); return true; }
    return false;
  };
  getWave(grp).then(w => { W = w; if (editorView[gid(grp)]) { V = clampV(...editorView[gid(grp)]); delete editorView[gid(grp)]; } else fit(); draw(); }).catch(err => { chk.textContent = "could not load audio: " + err; });
  new ResizeObserver(req).observe(cv);
}

function renderTable(id, rows, cols, onPlay, addRow) {
  const sec = $("#" + id);
  sec.innerHTML = `<table><thead><tr>${cols.map(c => `<th>${c.h}</th>`).join("")}<th></th></tr></thead><tbody></tbody></table>
    <p><button class="btn" id="${id}-add">+ add</button></p>`;
  const tb = $("tbody", sec);
  rows.forEach((r, k) => {
    const tr = document.createElement("tr");
    tr.innerHTML = cols.map(c => `<td>${c.render(r)}</td>`).join("") +
      `<td style="white-space:nowrap"><button class="btn" data-a="play">▶</button> <button class="btn" data-a="del">✕</button></td>`;
    tr.querySelectorAll("input").forEach(inp => inp.onchange = () => { cols.find(c => c.k === inp.dataset.k).set(r, inp.value); setDirty(true); });
    $('[data-a="play"]', tr).onclick = () => onPlay(r);
    $('[data-a="del"]', tr).onclick = () => { rows.splice(k, 1); setDirty(true); renderAll(); };
    tb.appendChild(tr);
  });
  $(`#${id}-add`).onclick = () => { rows.push(addRow()); setDirty(true); renderAll(); };
}
const tIn = (k, v) => `<input class="num" type="text" data-k="${k}" value="${fmt(v)}">`;
const txt = (k, v) => `<input type="text" data-k="${k}" value="${String(v).replace(/"/g, "&quot;")}">`;
function renderAll() {
  renderCuts();
  renderTable("chapters", D.chapters, [
    { h: "Start", k: "t", render: r => tIn("t", r[0]), set: (r, v) => r[0] = +parseT(v).toFixed(2) },
    { h: "Title", k: "x", render: r => txt("x", r[1]), set: (r, v) => r[1] = v }],
    r => play(`/audio?a=${r[0]}&b=${r[0] + 8}`), () => [D.show.start, "New chapter"]);
  renderTable("shorts", D.shorts, [
    { h: "Start", k: "a", render: r => tIn("a", r[0]), set: (r, v) => r[0] = +parseT(v).toFixed(2) },
    { h: "End", k: "b", render: r => tIn("b", r[1]), set: (r, v) => r[1] = +parseT(v).toFixed(2) },
    { h: "Len", k: "-", render: r => `${(r[1] - r[0]).toFixed(0)} s`, set: () => {} },
    { h: "Title", k: "x", render: r => txt("x", r[2]), set: (r, v) => r[2] = v }],
    r => play(`/audio?a=${r[0]}&b=${Math.min(r[1], r[0] + 20)}`), () => [D.show.start, D.show.start + 30, "SHORT: "]);
  renderTable("cold", D.cold_open, [
    { h: "Start", k: "a", render: r => tIn("a", r[0] / 30), set: (r, v) => r[0] = Math.round(parseT(v) * 30) },
    { h: "End", k: "b", render: r => tIn("b", r[1] / 30), set: (r, v) => r[1] = Math.round(parseT(v) * 30) },
    { h: "Len", k: "-", render: r => `${((r[1] - r[0]) / 30).toFixed(2)} s`, set: () => {} }],
    r => play(`/audio?a=${r[0] / 30}&b=${r[1] / 30}`), () => [Math.round(D.show.start * 30), Math.round(D.show.start * 30) + 90]);
  const total = D.cold_open.reduce((s, r) => s + (r[1] - r[0]) / 30, 0);
  const p = document.createElement("p");
  p.innerHTML = `Total ${total.toFixed(2)} s (target 8-11 s). <button class="btn" id="coldAll">▶ play whole cold open</button>`;
  $("#cold").prepend(p);
  $("#coldAll").onclick = () => play(`/audio_segs?segs=${D.cold_open.map(r => `${r[0] / 30},${r[1] / 30}`).join(";")}`);
}

async function save() {
  const decisions = {}, edits = {}, fades = {}, user_cuts = [];
  D.items.forEach(it => {
    if (it.group === "user") { user_cuts.push({ a: it.a, b: it.b, spk: it.spk, kind: it.kind || "cut", decision: it.decision, ...(it.anchor ? { anchor: it.anchor } : {}), ...(it.fade != null ? { fade: it.fade } : {}) }); return; }
    decisions[it.id] = it.decision; if (isEdited(it)) edits[it.id] = [it.a2, it.b2]; if (it.fade != null) fades[it.id] = it.fade;
  });
  const r = await fetch("/save", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ decisions, edits, fades, user_cuts, chapters: D.chapters, shorts: D.shorts, cold_open: D.cold_open }) }).then(r => r.json());
  D.saved_at = r.saved_at; setDirty(false);
  $("#status").textContent = `saved ${r.saved_at} · ${r.changed_from_default} changed from default · ${r.edited} edited · ${r.user_cuts} your cuts` + (r.config_changed.length ? ` · config: ${r.config_changed.join(", ")}` : "");
}

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["cuts", "cold", "chapters", "shorts"].forEach(id => $("#" + id).hidden = id !== b.dataset.tab);
});
document.querySelectorAll(".filters input, .filters select").forEach(x => x.onchange = () => { sel = 0; renderCuts(); });
$("#save").onclick = save;
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key === "s") { e.preventDefault(); save(); return; }
  if ($("#cuts").hidden || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const grp = GROUPS[sel]; if (!grp) return;
  if (openId === gid(grp) && edKey && edKey(e)) { e.preventDefault(); return; }
  if (e.key === "j") { sel = Math.min(GROUPS.length - 1, sel + 1); markSel(); $("#list .row.sel").scrollIntoView({ block: "center" }); }
  else if (e.key === "k") { sel = Math.max(0, sel - 1); markSel(); $("#list .row.sel").scrollIntoView({ block: "center" }); }
  else if (e.key === " ") { e.preventDefault(); playGroup(grp, true); }
  else if (e.key === "o") playGroup(grp, false);
  else if (e.key === "e") toggleEditor(grp);
  else if (e.key === "x") {   // toggles the whole row: all on -> all keep, otherwise all on
    const allOn = grp.every(x => x.decision !== "keep");
    grp.forEach(x => x.decision = allOn ? "keep" : options(x)[0]); setDirty(true); fillRow(rowEls[grp[0].id]); updateSummary(); }
});
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
fetch("/data").then(r => r.json()).then(d => { D = d; $("#title").textContent = `${d.episode} review`; document.title = `${d.episode} review`; setDirty(false); renderAll(); });
</script>
